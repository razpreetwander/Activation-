name: Get Unity License (.alf)

on:
  workflow_dispatch:

jobs:
  activation:
    name: Generate Activation File
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-2022.3.20f1-base-3
    steps:
      - name: Generate .alf file
        run: |
          unity-editor -batchmode -nographics -createManualActivationFile -logfile /dev/stdout || true
          ls -la

      - name: Upload .alf Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-File
          path: "*.alf"
          
